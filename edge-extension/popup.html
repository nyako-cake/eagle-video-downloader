<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      width: 280px;
      padding: 14px 16px 16px;
      background: #181921;
      color: #fff;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .sub {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #262733;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8d8e95;
      flex-shrink: 0;
    }

    .dot.ok {
      background: #4bd952;
    }

    .dot.warn {
      background: #f0a830;
    }

    .dot.err {
      background: #f56c6c;
    }

    .name {
      flex: 1;
    }

    .hint {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      line-height: 1.6;
    }

    .switch-row {
      justify-content: space-between;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #555975;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s ease;
    }

    .switch input:checked + .slider {
      background: #3197ff;
    }

    .switch input:checked + .slider::before {
      transform: translateX(14px);
    }

    .lan-select {
      width: 100%;
      box-sizing: border-box;
      height: 30px;
      margin: 6px 0 8px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #262733;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .lan-actions {
      display: flex;
      gap: 8px;
    }

    .lan-actions button {
      margin-top: 0;
    }

    .lan-actions button.secondary {
      background: #3a3c4d;
      flex: 0 0 64px;
    }

    .lan-status {
      margin: 8px 0 0;
      min-height: 14px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 10px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: #3197ff;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <h1>Eagle 视频下载助手</h1>
  <p class="sub">支持 X/Twitter 与 Sankaku：用页面按钮或工具栏图标推送链接，点赞、收藏也能自动推送。</p>

  <div class="row">
    <span id="pluginDot" class="dot"></span>
    <span class="name">Eagle 插件</span>
    <span id="pluginText">检测中…</span>
  </div>

  <div class="row switch-row">
    <span class="name">点赞时推送链接</span>
    <label class="switch">
      <input type="checkbox" id="likePush" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row switch-row">
    <span class="name">收藏时推送链接</span>
    <label class="switch">
      <input type="checkbox" id="bookmarkPush" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span class="name">局域网设备</span>
    <span id="lanCount">未扫描</span>
  </div>
  <select id="lanDevices" class="lan-select">
    <option value="">尚未发现设备</option>
  </select>
  <div class="lan-actions">
    <button id="lanSend" type="button">发送当前页面到局域网</button>
    <button id="lanRefresh" class="secondary" type="button">刷新</button>
  </div>
  <p id="lanStatus" class="lan-status"></p>

  <p class="hint">插件没打开时，会退回到 Eagle 本地 API 直接收直链（仅限 mp4 直链，NSFW/需要登录的推文请打开插件）。</p>
  <button id="refresh">重新检测</button>

  <script src="popup.js"></script>
</body>

</html>
